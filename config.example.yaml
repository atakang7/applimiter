# Copy to ~/.config/applimiter/config.yaml and edit before enabling.
poll_interval: 5
state_dir: ~/.local/share/applimiter

rules:
  - name: steam
    type: process
    match: steam
    category: fun
    daily_limit_minutes: 60
    enforcement: hard
    warn_at_minutes: [45, 55]

  - name: discord
    type: process
    match: Discord
    category: fun
    daily_limit_minutes: 90
    enforcement: soft
    warn_at_minutes: [60, 80]

  # Browser rules match window titles, not URLs.
  - name: youtube
    type: chrome_title
    match: ["youtube"]
    category: fun

  - name: reddit
    type: chrome_title
    match: ["reddit"]
    category: fun
    daily_limit_minutes: 20
    enforcement: soft
    warn_at_minutes: [15]

  - name: x-twitter
    type: chrome_title
    match: ["twitter", "x.com", " / x"]
    category: fun
    daily_limit_minutes: 30
    enforcement: soft
    warn_at_minutes: [20, 27]

  - name: kick
    type: chrome_title
    match: ["kick.com", "kick -"]
    category: fun
    blocked_before: "17:00"

  - name: linkedin
    type: chrome_title
    match: ["linkedin"]
    category: fun
    daily_limit_minutes: 10
    enforcement: hard
    warn_at_minutes: [7, 9]

  - name: chatgpt
    type: chrome_title
    match: ["chatgpt"]
    category: productive

  - name: claude
    type: chrome_title
    match: ["claude"]
    category: productive

  - name: gemini
    type: chrome_title
    match: ["gemini"]
    category: productive

  - name: code-editor
    type: process
    match: code
    category: productive

  - name: terminal
    type: process
    match: gnome-terminal-server
    category: productive

productivity_nudges:
  - minutes: 30
    message: "You've spent {fun_minutes}m on fun stuff today. Maybe it's time to start working?"
  - minutes: 60
    message: "{fun_minutes}m of fun today vs {productive_minutes}m productive. Consider calling it a day on distractions."
