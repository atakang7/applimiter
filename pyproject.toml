[project]
name = "applimiter"
version = "0.1.0"
description = "X11 foreground usage tracker with per-app and tab limits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.scripts]
applimiter = "applimiter.cli:main"
applimiter-daemon = "applimiter.daemon:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["applimiter", "applimiter.data"]

[tool.setuptools.package-data]
"applimiter.data" = ["*.service"]

[project.urls]
Repository = "https://github.com/atakang7/applimiter"
